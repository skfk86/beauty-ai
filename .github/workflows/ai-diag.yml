name: AI diagnostics
on:
  push:
    branches: [ai-diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test Lamsa AI server
        run: |
          U=https://lamsa-ai-dun.vercel.app/api/ai
          echo "GET: $(curl -s $U)"
          echo "POST no token: $(curl -s -X POST $U -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hi"}]}')"
          echo "POST fake token: $(curl -s -X POST $U -H 'Authorization: Bearer a.b.c' -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hi"}]}')"
          echo "OPTIONS: $(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS $U)"
